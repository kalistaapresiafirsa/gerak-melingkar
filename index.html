<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔗 Seporos - Simulasi Hubungan Roda</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0f1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 30% 40%, #142a4a 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, #1a1a3a 0%, transparent 50%),
                linear-gradient(180deg, #0a0f1a 0%, #141c2e 100%);
        }

        .wrapper {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .container {
            background: linear-gradient(145deg, #111b2e, #1a2844);
            border-radius: 28px;
            padding: 24px 28px 32px;
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.05), 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.06);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6ab8e8, #3a8ab5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .badge {
            background: rgba(106, 184, 232, 0.15);
            color: #6ab8e8;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid rgba(106, 184, 232, 0.15);
            -webkit-text-fill-color: #6ab8e8;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 860px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* ===== CANVAS ===== */
        .canvas-wrap {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .canvas-wrap canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 1/1;
            border-radius: 14px;
            background: #0a1626;
            display: block;
        }

        /* ===== KONTROL ===== */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .control-group {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .control-group label {
            color: #8aaac0;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
        }

        .control-group label span {
            color: #d0e8f5;
            font-weight: 700;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #1a3a5a, #4a8ab5);
            border-radius: 10px;
            outline: none;
            margin-top: 6px;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: radial-gradient(circle, #6ab8e8, #2a7aaa);
            border-radius: 50%;
            border: 2px solid #b0d8f0;
            box-shadow: 0 0 20px rgba(74, 138, 181, 0.3);
            cursor: pointer;
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
        }

        @media (max-width: 500px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .stat {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 10px 12px;
            text-align: center;
        }

        .stat .val {
            font-size: 1.2rem;
            font-weight: 700;
            color: #d0e8f5;
        }

        .stat .val.gold {
            color: #f5c542;
        }
        .stat .val.green {
            color: #5ac87a;
        }
        .stat .val.blue {
            color: #6ab8e8;
        }
        .stat .val.orange {
            color: #e87a3a;
        }

        .stat .lbl {
            font-size: 0.5rem;
            color: #6a8aaa;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ===== INFO ===== */
        .info-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 14px 18px;
            color: #8aaac0;
            font-size: 0.85rem;
            line-height: 1.9;
            border-left: 3px solid #6ab8e8;
        }

        .info-box .highlight {
            color: #f5c542;
            font-weight: 700;
        }
        .info-box .rumus {
            color: #d0e8f5;
            font-family: 'Cambria', 'Times New Roman', serif;
            font-style: italic;
            font-weight: 600;
        }

        /* ===== BUTTON ===== */
        .btn-sim {
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .btn-sim:active {
            transform: scale(0.95);
        }

        .btn-sim.play {
            background: linear-gradient(135deg, #2a8a5a, #1a6a3a);
            color: white;
            box-shadow: 0 3px 0 #0f3a22;
        }

        .btn-sim.pause {
            background: linear-gradient(135deg, #d4871a, #a85a10);
            color: white;
            box-shadow: 0 3px 0 #6a3a08;
        }

        .btn-sim.reset {
            background: rgba(255, 255, 255, 0.06);
            color: #b0c8e0;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-sim.reset:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .actions .btn-sim {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container">

            <div class="header">
                <h1>
                    <span>🔗</span> Seporos
                    <span class="badge">ω₁ = ω₂</span>
                </h1>
            </div>

            <div class="main-layout">

                <!-- KANVAS -->
                <div class="canvas-wrap">
                    <canvas id="rodaCanvas" width="600" height="600"></canvas>
                </div>

                <!-- KONTROL -->
                <div class="controls">

                    <div class="control-group">
                        <label>R<sub>A</sub> (Jari-jari roda A) <span id="rodaR1Label">2.0 m</span></label>
                        <input type="range" id="rodaR1Slider" min="0.8" max="4" step="0.1" value="2.0" />
                    </div>

                    <div class="control-group">
                        <label>R<sub>B</sub> (Jari-jari roda B) <span id="rodaR2Label">1.2 m</span></label>
                        <input type="range" id="rodaR2Slider" min="0.8" max="4" step="0.1" value="1.2" />
                    </div>

                    <div class="control-group">
                        <label>ω (Kecepatan sudut) <span id="rodaOmegaLabel">2.0 rad/s</span></label>
                        <input type="range" id="rodaOmegaSlider" min="0.5" max="5" step="0.1" value="2.0" />
                    </div>

                    <div class="stats-grid">
                        <div class="stat">
                            <div class="val gold" id="statOmega">2.00</div>
                            <div class="lbl">ω (rad/s)</div>
                        </div>
                        <div class="stat">
                            <div class="val green" id="statVA">4.00</div>
                            <div class="lbl">v<sub>A</sub> (m/s)</div>
                        </div>
                        <div class="stat">
                            <div class="val blue" id="statVB">2.40</div>
                            <div class="lbl">v<sub>B</sub> (m/s)</div>
                        </div>
                        <div class="stat">
                            <div class="val orange" id="statRatio">1.67</div>
                            <div class="lbl">v<sub>A</sub>/v<sub>B</sub> = R<sub>A</sub>/R<sub>B</sub></div>
                        </div>
                    </div>

                    <div class="actions">
                        <button class="btn-sim play" id="simPlay">▶ Jalankan</button>
                        <button class="btn-sim pause" id="simPause" style="display:none;">⏸ Jeda</button>
                        <button class="btn-sim reset" id="simReset">⟲ Reset</button>
                    </div>

                    <div class="info-box" id="infoBox">
                        💡 <span class="highlight">Seporos</span>: <span class="rumus">ω<sub>A</sub> = ω<sub>B</sub> = ω</span>
                        <br />
                        ω = <span id="infoOmega">2.00</span> rad/s
                        <br />
                        v<sub>A</sub> = <span id="infoVA">4.00</span> m/s, v<sub>B</sub> = <span id="infoVB">2.40</span> m/s
                        <br />
                        <span style="color:#f5c542;">v<sub>A</sub>/R<sub>A</sub> = v<sub>B</sub>/R<sub>B</sub> = ω</span>
                        <br />
                        <span style="color:#6a8aaa; font-size:0.8rem;">↻ Arah putaran: <strong style="color:#5ac87a;">sama</strong></span>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <script>
        // ================================================================
        //  SIMULASI SEPOROS – ω SAMA, POROS SAMA (DIPERBAIKI)
        //  Dua roda pada poros yang sama dengan posisi yang benar
        // ================================================================

        const canvas = document.getElementById('rodaCanvas');
        const ctx = canvas.getContext('2d');

        const R1Slider = document.getElementById('rodaR1Slider');
        const R2Slider = document.getElementById('rodaR2Slider');
        const omegaSlider = document.getElementById('rodaOmegaSlider');
        const R1Label = document.getElementById('rodaR1Label');
        const R2Label = document.getElementById('rodaR2Label');
        const omegaLabel = document.getElementById('rodaOmegaLabel');

        const statOmega = document.getElementById('statOmega');
        const statVA = document.getElementById('statVA');
        const statVB = document.getElementById('statVB');
        const statRatio = document.getElementById('statRatio');

        const infoOmega = document.getElementById('infoOmega');
        const infoVA = document.getElementById('infoVA');
        const infoVB = document.getElementById('infoVB');

        let state = {
            R1: 2.0,
            R2: 1.2,
            omega: 2.0,
            angle: 0, // satu sudut untuk kedua roda (ω sama)
            running: true,
            animId: null,
        };

        // ================================================================
        //  DRAW
        // ================================================================

        function drawRodaSimulation() {
            const W = canvas.width,
                H = canvas.height;
            const cx = W / 2,
                cy = H / 2;

            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#0a1626';
            ctx.fillRect(0, 0, W, H);

            // --- SKALA ---
            const scale = 50;
            const R1_px = state.R1 * scale;
            const R2_px = state.R2 * scale;

            // --- POSISI RODA (SEPOROS: POROS SAMA) ---
            // Kedua roda berada pada poros yang sama (sumbu vertikal di tengah)
            // Roda A di kiri, Roda B di kanan, dengan jarak agar tidak tumpang tindih
            const gap = 30;
            const totalR = R1_px + R2_px + gap;
            const x1 = cx - totalR / 2 + R1_px; // roda kiri
            const x2 = cx + totalR / 2 - R2_px; // roda kanan
            const y1 = cy;
            const y2 = cy;

            // --- GAMBAR POROS (GARIS VERTIKAL) ---
            // Poros utama dari atas ke bawah
            ctx.strokeStyle = 'rgba(106,184,232,0.2)';
            ctx.lineWidth = 3;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(cx, 30);
            ctx.lineTo(cx, H - 30);
            ctx.stroke();

            // Poros horizontal (penghubung ke roda)
            ctx.strokeStyle = 'rgba(106,184,232,0.08)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 8]);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Label poros
            ctx.fillStyle = 'rgba(106,184,232,0.12)';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('POROS SAMA', cx, 22);

            // --- GAMBAR RODA A (kiri) ---
            drawRoda(ctx, x1, y1, R1_px, state.angle, '#3a8ab5', 'A', state.R1.toFixed(1));

            // --- GAMBAR RODA B (kanan) ---
            drawRoda(ctx, x2, y2, R2_px, state.angle, '#f5a623', 'B', state.R2.toFixed(1));

            // --- LABEL KECEPATAN SUDUT ---
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.font = '11px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`ω₁ = ${state.omega.toFixed(1)} rad/s`, x1, y1 - R1_px - 20);
            ctx.fillText(`ω₂ = ${state.omega.toFixed(1)} rad/s`, x2, y2 - R2_px - 20);

            // --- LABEL HUBUNGAN (di bawah) ---
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.font = '13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('ω₁ = ω₂', cx, H - 16);

            // --- ARAH PUTARAN (SAMA) ---
            ctx.fillStyle = 'rgba(100,255,150,0.15)';
            ctx.font = '18px sans-serif';
            ctx.fillText('↻', x1 - R1_px - 35, cy + 6);
            ctx.fillText('↻', x2 + R2_px + 35, cy + 6);

            // --- LABEL ARAH ---
            ctx.fillStyle = 'rgba(100,255,150,0.08)';
            ctx.font = '9px sans-serif';
            ctx.fillText('arah sama', x1 - R1_px - 35, cy + 28);
            ctx.fillText('arah sama', x2 + R2_px + 35, cy + 28);

            // --- TANDA HUBUNGAN SEPOROS ---
            // Lingkaran kecil di poros
            ctx.beginPath();
            ctx.arc(cx, cy, 6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(106,184,232,0.3)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(106,184,232,0.2)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Update angle (ω sama untuk kedua roda)
            if (state.running) {
                state.angle += state.omega * 0.02;
            }
        }

        // ================================================================
        //  DRAW RODA
        // ================================================================

        function drawRoda(ctx, x, y, radius, angle, color, label, labelText) {
            // Lingkaran luar
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.strokeStyle = color + '55';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Fill dengan gradien
            const grad = ctx.createRadialGradient(x - radius * 0.2, y - radius * 0.2, radius * 0.05, x, y, radius);
            grad.addColorStop(0, color + '44');
            grad.addColorStop(0.5, color + '22');
            grad.addColorStop(1, color + '11');
            ctx.fillStyle = grad;
            ctx.fill();

            // Jari-jari penanda (garis dari pusat ke tepi)
            const endX = x + radius * Math.cos(angle);
            const endY = y + radius * Math.sin(angle);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = color + '77';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Titik di ujung jari-jari
            ctx.beginPath();
            ctx.arc(endX, endY, 6, 0, Math.PI * 2);
            ctx.fillStyle = color + '99';
            ctx.fill();
            ctx.strokeStyle = color + '44';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Lingkaran dalam (poros roda)
            ctx.beginPath();
            ctx.arc(x, y, radius * 0.1, 0, Math.PI * 2);
            ctx.fillStyle = color + '77';
            ctx.fill();

            // Label R
            ctx.fillStyle = color;
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('R' + label, x, y);

            // Nilai R
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.font = '10px sans-serif';
            ctx.textBaseline = 'top';
            ctx.fillText(`${labelText} m`, x, y + 18);

            // Gigi-gigi (dekorasi)
            const teeth = 14;
            for (let i = 0; i < teeth; i++) {
                const a = (i / teeth) * 2 * Math.PI + angle * 0.05;
                const r1 = radius - 5;
                const r2 = radius + 5;
                const x1 = x + r1 * Math.cos(a);
                const y1 = y + r1 * Math.sin(a);
                const x2 = x + r2 * Math.cos(a);
                const y2 = y + r2 * Math.sin(a);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = color + '22';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Reset text baseline
            ctx.textBaseline = 'alphabetic';
        }

        // ================================================================
        //  UPDATE STATS
        // ================================================================

        function updateStats() {
            const omega = state.omega;
            const R1 = state.R1;
            const R2 = state.R2;
            const v1 = R1 * omega;
            const v2 = R2 * omega;
            const ratio = R1 / R2;

            statOmega.textContent = omega.toFixed(2);
            statVA.textContent = v1.toFixed(2);
            statVB.textContent = v2.toFixed(2);
            statRatio.textContent = ratio.toFixed(2);

            infoOmega.textContent = omega.toFixed(2);
            infoVA.textContent = v1.toFixed(2);
            infoVB.textContent = v2.toFixed(2);

            // Update info box
            document.getElementById('infoBox').innerHTML = `
                💡 <span class="highlight">Seporos</span>: <span class="rumus">ω<sub>A</sub> = ω<sub>B</sub> = ω</span>
                <br />
                ω = <span id="infoOmega">${omega.toFixed(2)}</span> rad/s
                <br />
                v<sub>A</sub> = <span id="infoVA">${v1.toFixed(2)}</span> m/s &nbsp;|&nbsp; v<sub>B</sub> = <span id="infoVB">${v2.toFixed(2)}</span> m/s
                <br />
                <span style="color:#f5c542;">v<sub>A</sub>/R<sub>A</sub> = ${(v1/R1).toFixed(2)} = v<sub>B</sub>/R<sub>B</sub> = ${(v2/R2).toFixed(2)} = ω</span>
                <br />
                <span style="color:#6a8aaa; font-size:0.8rem;">↻ Arah putaran: <strong style="color:#5ac87a;">sama</strong></span>
                <br />
                <span style="color:#6a8aaa; font-size:0.75rem;">R<sub>A</sub> = ${R1.toFixed(1)} m, R<sub>B</sub> = ${R2.toFixed(1)} m</span>
            `;
        }

        // ================================================================
        //  LOOP
        // ================================================================

        function rodaLoop() {
            drawRodaSimulation();
            updateStats();
            state.animId = requestAnimationFrame(rodaLoop);
        }

        // ================================================================
        //  EVENT
        // ================================================================

        R1Slider.addEventListener('input', () => {
            state.R1 = parseFloat(R1Slider.value);
            R1Label.textContent = state.R1.toFixed(1) + ' m';
        });

        R2Slider.addEventListener('input', () => {
            state.R2 = parseFloat(R2Slider.value);
            R2Label.textContent = state.R2.toFixed(1) + ' m';
        });

        omegaSlider.addEventListener('input', () => {
            state.omega = parseFloat(omegaSlider.value);
            omegaLabel.textContent = state.omega.toFixed(1) + ' rad/s';
        });

        document.getElementById('simPlay').addEventListener('click', () => {
            state.running = true;
            document.getElementById('simPlay').style.display = 'none';
            document.getElementById('simPause').style.display = 'inline-flex';
        });

        document.getElementById('simPause').addEventListener('click', () => {
            state.running = false;
            document.getElementById('simPlay').style.display = 'inline-flex';
            document.getElementById('simPause').style.display = 'none';
        });

        document.getElementById('simReset').addEventListener('click', () => {
            state.angle = 0;
            state.running = true;
            document.getElementById('simPlay').style.display = 'none';
            document.getElementById('simPause').style.display = 'inline-flex';
        });

        // ================================================================
        //  INIT
        // ================================================================

        rodaLoop();

        console.log('🔗 Simulasi Seporos siap!');
        console.log('📐 ω₁ = ω₂ = ' + state.omega + ' rad/s');
        console.log('📏 R₁ = ' + state.R1 + ' m, R₂ = ' + state.R2 + ' m');
        console.log('📊 v₁ = ' + (state.R1 * state.omega) + ' m/s, v₂ = ' + (state.R2 * state.omega) + ' m/s');
    </script>

</body>
</html>
